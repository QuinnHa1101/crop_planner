name: Apply Gold seed cost policy

on:
  push:
    branches: [gh-pages]
    paths:
      - utils/apply_seed_cost_policy.py
      - .github/workflows/apply-seed-cost-policy.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply data and UI migration
        run: python3 utils/apply_seed_cost_policy.py
      - name: Validate planner files
        run: |
          python3 -m json.tool config.json >/dev/null
          node --check scripts/planner.js
          ! grep -q "seed-source-options" index.html
          ! grep -q "get_paid_seed_count" scripts/planner.js
      - name: Commit migrated planner
        run: |
          rm utils/apply_seed_cost_policy.py .github/workflows/apply-seed-cost-policy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.json scripts/planner.js index.html utils/apply_seed_cost_policy.py .github/workflows/apply-seed-cost-policy.yml
          git commit -m "Use verified Gold seed costs"
          git push
