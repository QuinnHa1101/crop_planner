name: Fix indoor crop carry-over

on:
  workflow_dispatch:
  push:
    branches:
      - gh-pages
    paths:
      - .github/scripts/fix_indoor_carryover.py
      - .github/workflows/fix-indoor-carryover.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Add indoor crop carry-over
        run: python3 .github/scripts/fix_indoor_carryover.py
      - name: Validate JavaScript
        run: node --check scripts/planner.js && node --check planner.js
      - name: Commit changes
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html planner.js scripts/planner.js
          if ! git diff --cached --quiet; then
            git commit -m "Carry greenhouse and island crops across years [skip ci]"
            git push origin gh-pages
          fi
