name: Fix crop recommendations

on:
  workflow_dispatch:
  push:
    branches:
      - gh-pages
    paths:
      - .github/scripts/fix_crop_recommendations.py
      - .github/workflows/fix-crop-recommendations.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Restore recommendation visibility
        run: python3 .github/scripts/fix_crop_recommendations.py
      - name: Validate planner
        run: |
          node --check scripts/planner.js
          node --check planner.js
          grep -q 'self.best_fit_crops = best_fit_crops' scripts/planner.js
          grep -q 'self.best_fit_crops(self.cdate, 3).length' index.html
      - name: Commit changes
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Keep crop recommendations visible [skip ci]"
            git push origin gh-pages
          fi
