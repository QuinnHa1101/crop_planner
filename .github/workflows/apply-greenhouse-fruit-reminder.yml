name: Add greenhouse fruit reminder

on:
  push:
    branches: [gh-pages]
    paths:
      - utils/apply_greenhouse_fruit_reminder.py
      - .github/workflows/apply-greenhouse-fruit-reminder.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply recurring reminder
        run: python3 utils/apply_greenhouse_fruit_reminder.py
      - name: Publish generated files to validation branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B reminder-validation
          git add config.json scripts/planner.js index.html
          git commit -m "Build greenhouse reminder for validation"
          git push --force origin reminder-validation
