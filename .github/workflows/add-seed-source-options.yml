name: Add seed source options

on:
  workflow_dispatch:
  push:
    branches:
      - gh-pages
    paths:
      - .github/scripts/add_seed_source_options.py
      - .github/workflows/add-seed-source-options.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Add seed source controls and costing
        run: python3 .github/scripts/add_seed_source_options.py
      - name: Validate JavaScript
        run: node --check scripts/planner.js && node --check planner.js
      - name: Commit changes
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html planner.js scripts/planner.js
          if ! git diff --cached --quiet; then
            git commit -m "Add seed source profit controls [skip ci]"
            git push origin gh-pages
          fi
