name: Fix Tea Bush outdoor winter rules

on:
  workflow_dispatch:
  push:
    branches:
      - gh-pages
    paths:
      - .github/scripts/fix_tea_island_season.py
      - .github/workflows/fix-tea-island-season.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - run: python3 .github/scripts/fix_tea_island_season.py
      - run: node --check scripts/planner.js && node --check planner.js && git diff --check
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html planner.js scripts/planner.js
          if ! git diff --cached --quiet; then
            git commit -m "Respect outdoor Tea Bush winter rules [skip ci]"
            git push origin gh-pages
          fi
